name: Build Pullr APK

on:
  push:
    branches:
      - pullr-app-upload
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Reassemble Android project
        shell: bash
        run: |
          set -euo pipefail
          cat source-parts/part-0[0-6].bin > /tmp/pullr-source.tar.xz
          base64 --decode source-parts/part-07.b64 >> /tmp/pullr-source.tar.xz
          xz --test /tmp/pullr-source.tar.xz
          mkdir -p project
          tar -xJf /tmp/pullr-source.tar.xz -C project
          test -f project/gradlew
          test -f project/app/build.gradle.kts

      - name: Build release APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Pullr APK
        uses: actions/upload-artifact@v4
        with:
          name: Pullr-apk
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
